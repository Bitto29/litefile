<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>LiteFile</title>
<style>
:root{color-scheme:dark;--bg:#101820;--surface:#18232d;--line:#2a3945;--text:#e8edf1;--muted:#94a2ad;--accent:#a8d5c8;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}
header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(18px,calc((100% - 940px)/2));gap:12px}header strong{font-size:17px;letter-spacing:.2px}header span{font-size:12px;color:var(--muted)}
main{width:min(940px,100%);margin:0 auto;padding:34px 20px 60px}.crumb{margin-bottom:22px;color:var(--muted);font-size:12px}.crumb button{padding:0;border:0;background:none;color:var(--accent);cursor:pointer}
h1{margin:0 0 7px;font-size:25px;font-weight:650} .sub{margin:0 0 25px;color:var(--muted);font-size:13px}
.list{border-top:1px solid var(--line)}.row{min-height:68px;padding:12px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;background:transparent}.row:hover{background:var(--surface)}
.folder-icon,.file-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:7px;background:#22313c;color:var(--accent);font-size:19px}
.item-main{min-width:0;flex:1}.item-title{overflow:hidden;font-size:14px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.item-sub{margin-top:5px;color:var(--muted);font-size:11px}
.open{border:0;background:none;color:var(--text);text-align:left;cursor:pointer;padding:0;min-width:0;flex:1}.share{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}.share:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:30px 14px;color:var(--muted);font-size:13px}
#reader{width:100%}.reader-head{display:flex;align-items:center;gap:12px;margin-bottom:15px}.back{padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);cursor:pointer;font-size:12px}.reader-title{min-width:0;flex:1;font-size:15px;font-weight:600;overflow-wrap:anywhere}.reader-actions{display:flex;gap:7px}.reader-actions a,.reader-actions button{padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);text-decoration:none;font-size:11px;white-space:nowrap;cursor:pointer}
.page-tools{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}.page-tools label{font-size:12px;color:var(--muted)}.page-tools input{width:76px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font:inherit}.page-tools button{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font:inherit;font-size:12px;cursor:pointer}.viewer{width:100%;height:calc(100vh - 215px);min-height:430px;border:0;background:#fff}
.viewer:fullscreen{width:100vw;height:100vh;min-height:100vh;border:0;background:#fff}
footer{margin-top:18px;color:#71808c;font-size:11px;line-height:1.6}
@media(max-width:600px){header{height:55px}main{padding:24px 14px 40px}h1{font-size:22px}.row{padding:10px 7px;gap:10px}.reader-head{flex-wrap:wrap}.reader-title{order:2;flex-basis:100%}.reader-actions{margin-left:auto}.viewer{height:calc(100dvh - 190px);min-height:380px}}
</style>
</head>
<body>
<header><strong>LiteFile</strong><span>Personal document library</span></header>
<main>
<section id="library">
<div class="crumb">MY LIBRARY</div>
<h1 id="heading">Folders</h1>
<p class="sub" id="description">Choose a folder to see its documents.</p>
<div class="list" id="items"></div>
</section>
<section id="reader" hidden>
<div class="reader-head">
<button class="back" id="back">← Back</button>
<div class="reader-title" id="docTitle"></div>
<div class="reader-actions">
<button id="shareReader" type="button">Share</button>
<button id="fullScreen" type="button" aria-label="View document fullscreen">⛶ Full screen</button>
<a id="original" target="_blank" rel="noopener noreferrer">Scribd ↗</a>
</div>
</div>
<div class="page-tools"><label for="pageNumber">Go to page</label><input id="pageNumber" type="number" min="1" step="1" inputmode="numeric" value="1"><button id="goPage" type="button">Go</button></div>
<iframe class="viewer" id="viewer" title="Document reader" allowfullscreen></iframe>
<footer>The document is displayed from Scribd. If it does not load, open it directly on Scribd.</footer>
</section>
</main>
<script src="documents.js"></script>
<script>
(function(){
"use strict";
var docs=Array.isArray(window.LITEFILE_DOCS)?window.LITEFILE_DOCS:[];
var activeFolder=null,activeDoc=null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function folderNames(){return Array.from(new Set(docs.map(function(d){return d.folder||"Unsorted"}))).sort(function(a,b){return a.localeCompare(b)})}
function shareUrl(d){var u=new URL(location.href);u.hash="doc="+encodeURIComponent(d.id);return u.href}
function share(d){
var url=shareUrl(d),data={title:d.title,text:"Read "+d.title+" in LiteFile",url:url};
if(navigator.share){navigator.share(data).catch(function(e){if(e.name!=="AbortError")copy(url)})}else copy(url)
}
function copy(url){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){alert("Share link copied!")}).catch(function(){prompt("Copy this link:",url)})}else prompt("Copy this link:",url)}
function showFolders(){
activeFolder=null;$("reader").hidden=true;$("library").hidden=false;$("heading").textContent="Folders";$("description").textContent="Choose a folder to see its documents.";
var names=folderNames();$("items").innerHTML=names.length?names.map(function(name){var count=docs.filter(function(d){return(d.folder||"Unsorted")===name}).length;return '<div class="row"><div class="folder-icon">▰</div><button class="open item-main" data-folder="'+esc(name)+'"><div class="item-title">'+esc(name)+'</div><div class="item-sub">'+count+' '+(count===1?"document":"documents")+'</div></button><span class="item-sub">Open ›</span></div>'}).join(""):'<div class="empty">No folders yet. Add documents in documents.js.</div>';
}
function showFolder(name){
activeFolder=name;$("heading").textContent=name;$("description").textContent="Documents in this folder.";$("library").hidden=false;$("reader").hidden=true;
var entries=docs.filter(function(d){return(d.folder||"Unsorted")===name});
$("items").innerHTML='<div class="row"><button class="back" id="folderBack">← Folders</button></div>'+entries.map(function(d){return '<div class="row"><div class="file-icon">▤</div><button class="open item-main" data-doc="'+esc(d.id)+'"><div class="item-title">'+esc(d.title)+'</div><div class="item-sub">'+esc(d.description||"Open document")+'</div></button><button class="share" data-share="'+esc(d.id)+'" title="Share document" aria-label="Share '+esc(d.title)+'">↗</button></div>'}).join("");
$("folderBack").addEventListener("click",showFolders);
}
function loadPage(page){if(!activeDoc)return;var n=Math.floor(Number(page));if(!Number.isFinite(n)||n<1){alert("Enter a valid page number (1 or higher).");return;}try{var u=new URL(activeDoc.embedUrl);u.searchParams.set("start_page",String(n));$("viewer").src=u.toString();$("pageNumber").value=String(n);}catch(e){alert("Could not set the page number for this document.");}}
function showDoc(id){
var d=docs.find(function(x){return x.id===id});if(!d)return showFolders();
activeDoc=d;$("library").hidden=true;$("reader").hidden=false;$("docTitle").textContent=d.title;$("original").href=d.sourceUrl||"https://www.scribd.com/";$("pageNumber").value="1";loadPage(1);history.replaceState(null,"",shareUrl(d));
}
$("items").addEventListener("click",function(e){
var f=e.target.closest("[data-folder]"),d=e.target.closest("[data-doc]"),s=e.target.closest("[data-share]");
if(f)showFolder(f.getAttribute("data-folder"));
if(d)showDoc(d.getAttribute("data-doc"));
if(s){var item=docs.find(function(x){return x.id===s.getAttribute("data-share")});if(item)share(item)}
});
$("back").addEventListener("click",function(){if(activeFolder)showFolder(activeFolder);else showFolders();history.replaceState(null,"",location.pathname+location.search)});
$("shareReader").addEventListener("click",function(){if(activeDoc)share(activeDoc)});
$("goPage").addEventListener("click",function(){loadPage($("pageNumber").value)});
$("pageNumber").addEventListener("keydown",function(e){if(e.key==="Enter")loadPage(this.value)});
$("fullScreen").addEventListener("click",function(){var frame=$("viewer");var enter=frame.requestFullscreen||frame.webkitRequestFullscreen;if(enter){var result=enter.call(frame);if(result&&result.catch)result.catch(function(){alert("Fullscreen is not supported by this browser.")})}else{alert("Fullscreen is not supported by this browser.")}});
window.addEventListener("hashchange",function(){var m=location.hash.match(/^#doc=(.+)$/);if(m)showDoc(decodeURIComponent(m[1]))});
showFolders();
var initial=location.hash.match(/^#doc=(.+)$/);if(initial)showDoc(decodeURIComponent(initial[1]));
}());
</script>
</body>
</html>
