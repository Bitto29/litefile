<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>LiteFile</title>
<style>
:root{color-scheme:dark;--bg:#101820;--surface:#18232d;--line:#2a3945;--text:#e8edf1;--muted:#94a2ad;--accent:#a8d5c8;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(18px,calc((100% - 940px)/2));gap:12px}header strong{font-size:20px}header span{font-size:13px;color:var(--muted)}
main{width:min(940px,100%);margin:0 auto;padding:30px 20px 50px}.crumb{margin-bottom:24px;color:var(--muted);font-size:13px}
h1{margin:0 0 7px;font-size:28px;font-weight:650}.sub{margin:0 0 25px;color:var(--muted);font-size:15px}
.list{border-top:1px solid var(--line)}.row{min-height:76px;padding:12px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px}
.folder-icon,.file-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:9px;background:#22313c;color:var(--accent)}
.folder-icon svg,.file-icon svg,.share svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item-main{min-width:0;flex:1}.item-title{overflow:hidden;font-size:16px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.item-sub{margin-top:5px;color:var(--muted);font-size:13px}
.open{display:block;width:100%;border:0;background:none;color:var(--text);text-align:left;cursor:pointer;padding:0;min-width:0;flex:1;text-decoration:none}
.share{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}.share:hover{border-color:var(--accent);color:var(--accent)}
.folder-back{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);text-decoration:none;font-size:14px}
.empty{padding:26px 14px;color:var(--muted);font-size:14px}
@media(max-width:600px){header{height:58px}main{padding:24px 14px 40px}h1{font-size:26px}.row{padding:11px 7px;gap:11px}.item-title{font-size:15px}}
</style>
</head>
<body>
<header><strong>LiteFile</strong><span>Personal document library</span></header>
<main>
<div class="crumb">MY LIBRARY</div>
<a class="folder-back" id="folderBack" href="index.html" hidden><span aria-hidden="true">←</span> Folders</a>
<h1 id="heading">Folders</h1>
<p class="sub" id="description">Choose a folder to see its documents.</p>
<div class="list" id="items"></div>
</main>
<script src="documents.js"></script>
<script>
(function(){
"use strict";
var docs=Array.isArray(window.LITEFILE_DOCS)?window.LITEFILE_DOCS:[];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shareUrl(d){return new URL("reader.html?id="+encodeURIComponent(d.id),location.href).href}
function share(d){
var url=shareUrl(d),data={title:d.title,text:"Read "+d.title+" in LiteFile",url:url};
if(navigator.share){navigator.share(data).catch(function(e){if(e.name!=="AbortError")copy(url)})}else copy(url)
}
function copy(url){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){alert("Share link copied")}).catch(function(){prompt("Copy link:",url)})}else prompt("Copy link:",url)}
function folders(){
$("folderBack").hidden=true;$("heading").textContent="Folders";$("description").textContent="Choose a folder to see its documents.";
var names=Array.from(new Set(docs.map(function(d){return d.folder||"Unsorted"}))).sort();
$("items").innerHTML=names.length?names.map(function(name){
var count=docs.filter(function(d){return(d.folder||"Unsorted")===name}).length;
return '<div class="row"><div class="folder-icon"><svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></div><button class="open item-main" data-folder="'+esc(name)+'"><div class="item-title">'+esc(name)+'</div><div class="item-sub">'+count+' '+(count===1?"document":"documents")+'</div></button></div>'
}).join(""):'<div class="empty">No folders yet. Add documents in documents.js.</div>';
}
function folder(name){
$("folderBack").hidden=false;$("heading").textContent=name;$("description").textContent="Documents in this folder.";
$("folderBack").href="index.html";
var entries=docs.filter(function(d){return(d.folder||"Unsorted")===name});
$("items").innerHTML=entries.length?entries.map(function(d){
return '<div class="row"><div class="file-icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M9 12h6M9 16h6"/></svg></div><a class="open item-main" href="reader.html?id='+encodeURIComponent(d.id)+'"><div class="item-title">'+esc(d.title)+'</div><div class="item-sub">'+esc(d.description||"Open document")+'</div></a><button class="share" data-share="'+esc(d.id)+'" aria-label="Share '+esc(d.title)+'" title="Share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"/></svg></button></div>'
}).join(""):'<div class="empty">No documents in this folder yet.</div>';
}
$("items").addEventListener("click",function(e){
var f=e.target.closest("[data-folder]"),s=e.target.closest("[data-share]");
if(f){folder(f.getAttribute("data-folder"));history.replaceState(null,"","#folder="+encodeURIComponent(f.getAttribute("data-folder")))}
if(s){var d=docs.find(function(x){return x.id===s.getAttribute("data-share")});if(d)share(d)}
});
$("folderBack").addEventListener("click",function(e){e.preventDefault();history.replaceState(null,"",location.pathname+location.search);folders()});
var m=location.hash.match(/^#folder=(.*)$/);
if(m){var name=decodeURIComponent(m[1]);if(docs.some(function(d){return(d.folder||"Unsorted")===name}))folder(name);else folders()}else folders();
}());
</script>
</body>
</html>
